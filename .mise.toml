[tools]
go = "1.27.4"
node = "24.22.1"

[tasks.fmt]
run = "gofmt -w cmd internal test"

[tasks."fmt:check"]
run = '''
set -eu
unformatted="$(gofmt -l cmd internal test)"
if [ -n "$unformatted" ]; then
  printf 'Run mise run fmt to format these files:\n%s\n' "$unformatted" >&2
  exit 1
fi
'''

[tasks.build]
run = "go build -o bin/nook ./cmd/nook"

[tasks.install]
description = "Install nook into ~/.local/bin or NOOK_INSTALL_DIR"
run = '''
GOBIN="${NOOK_INSTALL_DIR:-$HOME/.local/bin}" go install ./cmd/nook
'''

[tasks.test]
run = "go test -race ./internal/..."

[tasks."test:architecture"]
run = "go test -count=1 ./internal/architecture"

[tasks."test:e2e"]
run = "go test -count=1 ./test/e2e/..."

[tasks."test:vm"]
run = "AGENTNOOK_VM_SMOKE=1 go test -count=1 -run '^TestReal(VM|OpenCodeVM|ClaudeVM|NetworkVM|PrivateNetworkVM)$' -timeout 25m -v ./test/e2e/..."

[tasks.vet]
run = "go vet ./..."

[tasks.check]
depends = ["fmt:check", "test", "test:e2e", "vet", "build"]
